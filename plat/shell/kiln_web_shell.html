<!doctype html>
<!-- SPDX-License-Identifier: MIT
     The page emcc wraps a Kiln game in. Deliberately plain: the canvas is the
     product, and anything else on the page is competing with a 320x240 frame
     for the reader's attention. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiln</title>
<!-- An inline data: favicon, because a page served without one makes the
     browser request /favicon.ico and log a 404 — which is indistinguishable,
     in a console log, from the wasm or the .data file failing to load. The
     verifier asserts on zero page errors, so a harmless 404 would either fail
     it or teach it to ignore a class of error that matters. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314110f'/%3E%3Cpath d='M4 3h2v4l3-4h2L8 7l3 6H9L6.5 8.5 6 9v4H4z' fill='%23ff7a3d'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14110f; color: #d8cfc6;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         display: flex; flex-direction: column; min-height: 100vh; }
  header, footer { padding: .6rem 1rem; }
  header { border-bottom: 1px solid #2a2420; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; background: #000; }
  #status { color: #a8998c; }
  kbd { background: #241f1b; border: 1px solid #3a322c; border-radius: 3px;
        padding: 0 .3em; }
  footer { border-top: 1px solid #2a2420; color: #a8998c; }
</style>
</head>
<body>
<header><strong>kiln</strong> <span id="status">loading…</span></header>
<main><canvas id="canvas" tabindex="-1"></canvas></main>
<footer>
  <kbd>WASD</kbd> stick ·
  <kbd>arrows</kbd> D-pad ·
  <kbd>space</kbd> A ·
  <kbd>,</kbd> B ·
  <kbd>shift</kbd> Z ·
  <kbd>Q</kbd>/<kbd>E</kbd> L/R ·
  <kbd>IJKL</kbd> C ·
  <kbd>enter</kbd> start.
  A gamepad is used when connected. Click once to allow audio.
</footer>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { statusEl.textContent = t || 'running'; },
    onRuntimeInitialized: function () { statusEl.textContent = 'running'; }
  };
</script>
<script>
  // Kiln Studio embeds this page, same origin, and drives it through
  // Module.kiln (plat/shell/shell_web.c's studio bridge): console commands and
  // pad input go onto queues the launcher drains between frames, and the frame
  // count, the pad and the console's log come back. Only the embedding window
  // on this origin is listened to or answered; opened on its own, a page has
  // no parent and none of this runs.
  (function () {
    if (window.parent === window) return;
    var parentWin = window.parent, origin = location.origin;
    var k = Module.kiln = Module.kiln || {};
    window.addEventListener('message', function (e) {
      if (e.origin !== origin || e.source !== parentWin || !e.data) return;
      var m = e.data;
      if (typeof m.cmd === 'string') (k.cmdq = k.cmdq || []).push(m.cmd.slice(0, 63));
      if (m.pad && typeof m.pad === 'object') {
        (k.padq = k.padq || []).push({ buttons: m.pad.buttons | 0, stick_x: m.pad.stick_x | 0,
          stick_y: m.pad.stick_y | 0, frames: Math.max(1, Math.min(600, m.pad.frames | 0)) });
      }
      if (m.shot) parentWin.postMessage({ kiln: 'shot', png: Module.canvas.toDataURL('image/png') }, origin);
    });
    var sentConsole = -1;
    setInterval(function () {
      if (!k.frame) return;
      var msg = { kiln: 'state', frame: k.frame, pad: k.pad };
      if (k.consoleSeq !== sentConsole) { msg.console = k.console; sentConsole = k.consoleSeq; }
      parentWin.postMessage(msg, origin);
    }, 250);
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
